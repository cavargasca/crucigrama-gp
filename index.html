<style>
:root{--g:#094D2C;--g2:#0F6B3E;--g3:#E3EFE8;--gold:#C9A227;--gold2:#F4E9BD;--ink:#12251b;--mut:#5b6b62;--paper:#F5F3EC;--card:#fff;--line:#D8DDD6;--red:#B3261E;--ok:#1E7B46;--h:#DCEAF5;--v:#FBF0C9;--x:#E6D7F2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif}
button{font:inherit;cursor:pointer}
.hide{display:none!important}
header.top{background:var(--g);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 18px;position:sticky;top:0;z-index:30;box-shadow:0 2px 8px #0003}
header.top img{height:36px;display:block}
header.top .ttl{flex:1;min-width:0}
header.top .ttl b{display:block;font-family:Georgia,serif;font-size:1.05rem;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .ttl small{opacity:.8;font-size:.78rem}
.pill{background:#ffffff1f;border:1px solid #ffffff40;border-radius:999px;padding:5px 12px;font-size:.85rem;white-space:nowrap}
.pill b{font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--g);color:#fff;transition:.15s}
.btn:hover{background:var(--g2)}
.btn.alt{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.btn.alt:hover{background:var(--g3)}
.btn.gold{background:var(--gold);color:#241c00}
.btn.red{background:var(--red)}
.btn.sm{padding:6px 11px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.wrap{max-width:1280px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 1px 3px #0001}
input,select,textarea{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #0F6B3E55;border-color:var(--g2)}
label{display:block;font-size:.8rem;font-weight:600;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.5px}
/* landing */
.hero{background:linear-gradient(135deg,var(--g) 0%,#0b5f37 60%,#127a47 100%);color:#fff;border-radius:22px;padding:34px 30px;display:grid;grid-template-columns:1.2fr .8fr;gap:26px;align-items:center;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(#ffffff22,#0000 70%)}
.hero h1{font-size:2.1rem;margin:0 0 8px;line-height:1.15}
.hero p{margin:0 0 14px;opacity:.9;max-width:52ch}
.hero .tag{display:inline-block;background:var(--gold);color:#241c00;font-weight:700;border-radius:999px;padding:4px 12px;font-size:.78rem;letter-spacing:.5px;margin-bottom:12px}
.hero img{width:100%;max-width:360px;justify-self:center;filter:drop-shadow(0 6px 14px #0005)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:18px}
.choice h3{margin:0 0 4px;color:var(--g)}
.choice p{margin:0 0 10px;color:var(--mut);font-size:.92rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:18px}
.steps div{background:var(--g3);border-radius:12px;padding:12px 14px;font-size:.9rem}
.steps b{display:block;color:var(--g);font-family:Georgia,serif;font-size:1.05rem}
.foot{text-align:center;color:var(--mut);font-size:.8rem;padding:18px}
.err{background:#fde8e6;color:var(--red);border:1px solid #f3bbb6;border-radius:10px;padding:9px 12px;margin-top:10px;font-size:.9rem}
.note{background:var(--gold2);border:1px solid #e3d28a;border-radius:10px;padding:9px 12px;margin-top:10px;font-size:.88rem}
/* teams */
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:10px 0}
.teambtn{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;text-align:left;transition:.15s}
.teambtn:hover{border-color:var(--g2);background:var(--g3)}
.teambtn b{display:block;color:var(--g)}
.teambtn small{color:var(--mut)}
/* game */
.game{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.gridbox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;overflow:auto;max-height:calc(100vh - 210px);position:relative}
.cw{display:grid;gap:2px;width:max-content;margin:0 auto;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.c{position:relative;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--cs)*.52);color:var(--g);border-radius:4px;cursor:pointer}
.c.on{background:var(--h);border:1px solid #9bb8d0}
.c.on.v{background:var(--v);border-color:#d8c47a}
.c.on.hv{background:var(--x);border-color:#b99fd3}
.c.inw{background:#BFE0C8!important}
.c.sel{background:var(--gold)!important;border-color:#8a6d00!important;box-shadow:0 0 0 2px #8a6d00 inset}
.c.ok{color:#fff;background:var(--ok)!important;border-color:#14582f}
.c.rev{color:#7a5b00}
.c.wrong{background:#f6c6c1!important;border-color:var(--red)}
.c .lb{position:absolute;left:2px;top:0;font-size:calc(var(--cs)*.28);font-weight:700;color:#1F4E79;line-height:1.2;pointer-events:none}
.c.ok .lb{color:#d6f3df}
.side{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 210px);overflow:auto}
.cluebox{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}
.cluebox h3{margin:0 0 6px;color:var(--g);font-size:1rem;display:flex;justify-content:space-between}
.cl{display:flex;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:.86rem;line-height:1.3;border:1px solid transparent}
.cl:hover{background:var(--g3)}
.cl.cur{background:var(--gold2);border-color:#e3d28a}
.cl.done{opacity:.6}
.cl.done .t{text-decoration:line-through}
.cl .n{font-weight:800;color:var(--g);min-width:2.1em}
.cl .k{margin-left:auto;white-space:nowrap;color:var(--mut);font-size:.75rem}
.bar{display:flex;gap:10px;align-items:center;background:var(--g);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:10px}
.bar .cluetxt{flex:1;font-size:.95rem}
.bar .cluetxt b{color:var(--gold)}
.bar button{background:#ffffff22;border:0;color:#fff;border-radius:8px;padding:6px 10px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center}
.stat b{display:block;font-family:Georgia,serif;font-size:1.35rem;color:var(--g);font-variant-numeric:tabular-nums}
.stat small{color:var(--mut);font-size:.72rem;text-transform:uppercase;letter-spacing:.5px}
.timer{font-family:Georgia,serif;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:1px}
.timer.warn{color:#f0b429}.timer.crit{color:#ff6b5e;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.cd{position:fixed;inset:0;background:#094D2Cf2;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:80;font-family:Georgia,serif}
.cd .num{font-size:min(38vw,300px);font-weight:700;line-height:1;animation:pop 1s infinite}
@keyframes pop{0%{transform:scale(1.25);opacity:0}30%{opacity:1}100%{transform:scale(.9);opacity:.8}}
/* professor */
.pgrid{display:grid;grid-template-columns:380px minmax(0,1fr);gap:16px;align-items:start}
.code{font-family:Georgia,serif;font-size:3.2rem;letter-spacing:.35em;text-align:center;color:var(--g);background:var(--g3);border-radius:14px;padding:6px 0 6px .35em;font-weight:700}
.bigtimer{font-size:min(14vw,6rem);text-align:center;color:var(--g);line-height:1.1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
table.rk{width:100%;border-collapse:collapse;font-size:.92rem}
table.rk th{text-align:left;color:var(--mut);font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:2px solid var(--line)}
table.rk td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.rk tr.me td{background:var(--gold2)}
.pos{display:inline-flex;width:28px;height:28px;border-radius:50%;background:var(--g3);color:var(--g);font-weight:800;align-items:center;justify-content:center}
.pos.p1{background:#F2C94C;color:#3d2e00}.pos.p2{background:#D5D9DE;color:#2c3036}.pos.p3{background:#D99A6C;color:#3a1d08}
.prog{height:9px;background:#e6ebe7;border-radius:6px;overflow:hidden;min-width:90px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--g2),#38a169);transition:width .4s}
.off{font-size:.7rem;background:#eee;border-radius:6px;padding:1px 6px;color:var(--mut);margin-left:6px}
.proj .cfgcol{display:none}.proj .pgrid{grid-template-columns:1fr}.proj table.rk{font-size:1.25rem}
.modal{position:fixed;inset:0;background:#0009;z-index:70;display:flex;align-items:center;justify-content:center;padding:14px}
.modal .box{background:#fff;border-radius:18px;max-width:900px;width:100%;max-height:92vh;overflow:auto;padding:20px;position:relative}
.modal .x{position:absolute;right:12px;top:10px;background:none;border:0;font-size:1.6rem;color:var(--mut)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:22px 0 10px;min-height:290px}
.pod{width:min(30%,210px);text-align:center;animation:rise .9s both}
.pod .nm{font-family:Georgia,serif;font-weight:700;font-size:1.05rem;margin-bottom:2px;word-break:break-word}
.pod .pt{color:var(--mut);margin-bottom:6px;font-size:.92rem}
.pod .blk{border-radius:12px 12px 0 0;display:flex;align-items:flex-start;justify-content:center;font-family:Georgia,serif;font-size:2.6rem;font-weight:700;padding-top:8px;color:#fff}
.pod.p1 .blk{height:170px;background:linear-gradient(#F2C94C,#b8901a)}.pod.p2 .blk{height:125px;background:linear-gradient(#cfd4da,#8d949c)}.pod.p3 .blk{height:90px;background:linear-gradient(#e0a679,#a8693a)}
.pod.p1{animation-delay:.9s}.pod.p2{animation-delay:.45s}.pod.p3{animation-delay:0s}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:99}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:#3ddc84;margin-right:6px;animation:pulse 1.4s infinite}
.live.bad{background:#ff6b5e}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 18px;border-radius:999px;z-index:90;box-shadow:0 6px 20px #0005;font-size:.92rem}
.mini .cw{gap:1px}
@media (max-width:1000px){.game{grid-template-columns:minmax(0,1fr)}.wrap{min-width:0}.side,.gridbox{max-height:none}.pgrid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero img{max-width:240px}.hero h1{font-size:1.6rem}header.top .ttl small{display:none}}
@media (max-width:560px){header.top .ttl{display:none}header.top{justify-content:space-between}.gridbox{padding:4px}.cw{gap:1px}.wrap{padding:8px}header.top{padding:6px 10px}header.top img{height:28px}.wrap{padding:10px}.card{padding:14px}.code{font-size:2.3rem}.pill{padding:4px 9px;font-size:.78rem}}
@media print{header.top,.tools,.btn{display:none}}
.how{text-align:center;color:var(--g);margin:22px 0 8px}.choice{position:relative}.num{position:absolute;top:-10px;left:-10px;background:var(--gold,#C9A227);color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.mode{border:2px solid #dfe8e2;border-radius:14px;padding:14px;background:#fafcfb}.mode h3{margin:0 0 4px;color:var(--g)}.mode p{margin:0 0 10px;color:var(--mut);font-size:.92rem}
.seg{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0}.seg label{display:flex;align-items:center;gap:6px;border:2px solid #dfe8e2;border-radius:10px;padding:8px 12px;cursor:pointer;margin:0}.seg input{width:auto;margin:0}
</style>
</head>

class Board{
  constructor(){this.L=Array(N).fill('');this.lock=new Set();this.solved={};this.hints=0;this.checks=0;this.bonus=0;this.lastT=0}
  static load(o){const b=new Board();if(!o)return b;(o.L||'').split('').forEach((ch,i)=>{b.L[i]=ch===' '?'':ch});b.lock=new Set(o.lock||[]);b.solved=o.solved||{};b.hints=o.hints||0;b.checks=o.checks||0;b.bonus=o.bonus||0;b.lastT=o.lastT||0;return b}
  dump(){return{L:this.L.map(x=>x||' ').join(''),lock:[...this.lock],solved:this.solved,hints:this.hints,checks:this.checks,bonus:this.bonus,lastT:this.lastT}}
  eval(ix,t,first){const out=[];for(const wi of cellWords[ix]){if(this.solved[wi])continue;const w=W[wi];if(w.cells.every((c,k)=>this.L[c]===w.ans[k])){this.solved[wi]={t,b:first?!!first(wi):false};w.cells.forEach(c=>this.lock.add(c));this.lastT=t;out.push(wi)}}return out}
  set(ix,ch,t,first){if(!active[ix]||this.lock.has(ix))return[];this.L[ix]=ch;return ch?this.eval(ix,t,first):[]}
  reveal(ix,t,first){if(!active[ix]||this.lock.has(ix))return null;this.L[ix]=ansAt[ix];this.lock.add(ix);this.hints++;return this.eval(ix,t,first)}
  wrong(wi){const w=W[wi];this.checks++;return w.cells.filter((c,k)=>this.L[c]&&this.L[c]!==w.ans[k])}
  nsolved(){return Object.keys(this.solved).length}
  score(cfg){let s=0;for(const wi in this.solved)s+=W[wi].l*cfg.ppl+(this.solved[wi].b?cfg.firstBonus:0);s-=this.hints*cfg.hintPen+this.checks*cfg.checkPen;s+=this.bonus;return Math.max(0,Math.round(s))}
}
const cmpRank=(a,b)=>b.score-a.score||b.solved-a.solved||a.lastT-b.lastT||a.name.localeCompare(b.name);

 },

function makeGrid(host,{readonly=false,onSelect,cs}={}){
  const cells=new Array(N).fill(null);const g=document.createElement('div');g.className='cw';
  const narrow=innerWidth<=560,gap=narrow?1:2,aw=(host.clientWidth||Math.min(innerWidth-16,900))-(narrow?10:26);const size=cs||Math.max(narrow?18:26,Math.min(40,Math.floor(aw/C)-gap,narrow?99:Math.floor((innerHeight-250)/R)-gap));
  g.style.setProperty('--cs',size+'px');g.style.gap=gap+'px';g.style.gridTemplateColumns=`repeat(${C},${size}px)`;g.style.gridAutoRows=size+'px';
  for(let i=0;i<N;i++){const d=document.createElement('div');if(active[i]){const hv=cellWords[i].map(w=>W[w].d);d.className='c on'+(hv.includes('H')&&hv.includes('V')?' hv':hv[0]==='V'?' v':'');d.dataset.i=i;d.innerHTML='<span class="ch"></span>'+(startLabel[i]?`<span class="lb">${startLabel[i].join(' ')}</span>`:'');cells[i]=d}g.appendChild(d)}
  host.innerHTML='';host.appendChild(g);
  if(!readonly)g.addEventListener('click',e=>{const c=e.target.closest('.c.on');if(c)onSelect&&onSelect(+c.dataset.i)});
  return{g,cells,paint(st){for(let i=0;i<N;i++){const d=cells[i];if(!d)continue;const ch=st.letters[i]||'';const s=d.firstChild;if(s.textContent!==ch)s.textContent=ch;const ok=st.lock.has(i);d.classList.toggle('ok',ok&&!st.rev.has(i));d.classList.toggle('rev',st.rev.has(i)&&ok&&false);d.classList.toggle('wrong',!!(st.wrong&&st.wrong.has(i)));d.classList.toggle('sel',st.sel===i);d.classList.toggle('inw',!!(st.word&&st.word.cells.includes(i))&&st.sel!==i)}}}

/* ---- Participante: conexión a sala ---- */
const Net={peer:null,conn:null,pid:store.get('cwgp_pid')||(()=>{const p=rid();store.set('cwgp_pid',p);return p})(),room:'',name:'',team:'',off:0,rtt:0,closed:false,retry:0};
function joinRoom(room,name,resume){
  const err=m=>{const e=$('#j-err');if(e)e.innerHTML=`<div class="err">${esc(m)}</div>`};
  if(!/^[A-Z0-9]{4}$/.test(room))return err('El código tiene 4 caracteres.');if(!name)return err('Escriba su nombre.');
  Net.room=room;Net.name=name;Net.closed=false;Net.retry=0;
  if(!resume)Net.team='';else{const s=store.get('cwgp_session');Net.team=s&&s.team||''}
  UI.S=newState('room');app.innerHTML=`<div class="wrap"><div class="card" style="max-width:520px;margin:40px auto;text-align:center"><h3>Conectando con la sala <b>${esc(room)}</b>…</h3><p style="color:var(--mut)">Esto toma unos segundos.</p><div id="j-err"></div><button class="btn alt" id="back">Cancelar</button></div></div>`;
  $('#back').onclick=()=>{leaveRoom();viewHome()};
  connect();
}
function connect(){
  try{Net.peer&&Net.peer.destroy()}catch(e){}
  let p;try{p=new Peer(peerOpts())}catch(e){return netFail('No se pudo iniciar la conexión.')}
  Net.peer=p;
  p.on('open',()=>{const c=p.connect(ROOM_PREFIX+Net.room,{reliable:true});Net.conn=c;let opened=false;
    const to=setTimeout(()=>{if(!opened)netFail('No se encontró la sala. Verifique el código y que el profesor tenga el panel abierto.')},12000);
    c.on('open',()=>{opened=true;clearTimeout(to);Net.retry=0;c.send({t:'hello',pid:Net.pid});Net.t0=performance.now();Net.pingId=rid();c.send({t:'ping',id:Net.pingId})});
    c.on('data',onNet);c.on('close',()=>{if(!Net.closed)netLost()});c.on('error',()=>{})});
  p.on('error',e=>{if(e.type==='peer-unavailable')netFail('No se encontró la sala. Verifique el código y que el profesor tenga el panel abierto.');else if(!Net.closed)netLost()});
  p.on('disconnected',()=>{if(!Net.closed)try{p.reconnect()}catch(e){}});
}
function netFail(m){Net.closed=true;try{Net.peer&&Net.peer.destroy()}catch(e){}viewHome();const e=$('#j-err');if(e)e.innerHTML=`<div class="err">${esc(m)}</div>`}
function netLost(){UI.refreshNet&&UI.refreshNet('bad');if(Net.retry++<40)setTimeout(()=>{if(!Net.closed)connect()},2000);else netFail('Se perdió la conexión con la sala.')}
function leaveRoom(){Net.closed=true;try{Net.conn&&Net.conn.close()}catch(e){}try{Net.peer&&Net.peer.destroy()}catch(e){}}
function sendNet(m){try{if(Net.conn&&Net.conn.open)Net.conn.send(m)}catch(e){}}
function newState(mode){return{mode,letters:Array(N).fill(''),lock:new Set(),rev:new Set(),wrong:new Set(),solved:{},score:0,hints:0,status:'lobby',startAt:0,endAt:0,remain:0,cfg:{...DEF},rank:[],showRank:true,members:[],team:'',off:0,sel:-1,dir:'H',pend:{},netok:true}}
function onNet(m){const S=UI.S;if(!S||S.mode!=='room')return;
  if(m.t==='pong'&&m.id===Net.pingId){const rtt=performance.now()-Net.t0;S.off=m.now+rtt/2-Date.now()}
  else if(m.t==='welcome'){S.off=m.now-Date.now();applyBase(S,m);S.teamList=m.teams;if(Net.team){sendNet({t:'join',pid:Net.pid,name:Net.name,team:Net.team})}else viewTeamPick()}
  else if(m.t==='state'){S.off=m.now-Date.now()+ (S.rtt||0);applyBase(S,m);const b=m.board;const now=performance.now();
    b.L.split('').forEach((ch,i)=>{ch=ch===' '?'':ch;if(S.pend[i]&&now-S.pend[i]<900)return;S.letters[i]=ch});
    S.lock=new Set(b.lock);S.rev=new Set();S.solved=b.solved;S.score=m.score;S.hints=b.hints;S.members=m.members;S.team=m.team;
    Net.team=m.team;store.set('cwgp_session',{room:Net.room,name:Net.name,team:Net.team});
    if(UI.view!=='game'&&UI.view!=='final')viewGame();else gameRefresh(true)}
  else if(m.t==='rank'){S.rank=m.rows;S.showRank=m.show;gameRefresh();if(UI.view==='final')renderFinal()}
  else if(m.t==='checkres'){S.wrong=new Set(m.wrong);gameRefresh();setTimeout(()=>{S.wrong=new Set();gameRefresh()},1800);toast(m.wrong.length?`${m.wrong.length} letra(s) incorrecta(s) marcadas en rojo`:'Hasta ahora, ninguna letra está mal ✔')}
  else if(m.t==='err'){toast(m.msg,3500);if(UI.view==='team')viewTeamPick(m.msg)}
  else if(m.t==='kicked'){leaveRoom();store.del('cwgp_session');alert('El profesor retiró a su equipo de la sala.');viewHome()}
}

function podiumHTML(rows){const top=rows.slice(0,3);if(!top.length)return'';const order=[1,0,2].filter(i=>top[i]);
 return `<div class="podium">${order.map(i=>`<div class="pod p${i+1}"><div class="nm">${i===0?'🏆 ':''}${esc(top[i].name)}</div><div class="pt">${top[i].score} pts · ${top[i].solved}/${W.length}</div><div class="blk">${i+1}</div></div>`).join('')}</div>`}
function rankTable(rows,me){return `<div style="overflow:auto;text-align:left"><table class="rk"><thead><tr><th>#</th><th>Equipo</th><th>Palabras</th><th style="text-align:right">Puntos</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${r.name===me&&!r.off?'me':''}"><td><span class="pos ${i<3?'p'+(i+1):''}">${i+1}</span></td><td><b>${esc(r.name)}</b>${r.off?'<span class="off">sin conexión</span>':''}</td><td><div class="prog"><i style="width:${r.solved/W.length*100}%"></i></div><small>${r.solved}/${W.length}</small></td><td style="text-align:right"><b>${r.score}</b></td></tr>`).join('')}</tbody></table></div>`}
function confetti(ms){const cv=$('#confetti');cv.classList.remove('hide');const x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const cols=['#094D2C','#C9A227','#F2C94C','#38a169','#fff','#1F4E79'];const ps=Array.from({length:160},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:5+Math.random()*7,c:cols[Math.random()*cols.length|0],r:Math.random()*6,vr:(Math.random()-.5)*.3}));const t0=performance.now();
 (function f(t){x.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});if(t-t0<ms)requestAnimationFrame(f);else{x.clearRect(0,0,cv.width,cv.height);cv.classList.add('hide')}})(t0)}

}

function viewHost(){UI.view='host';setHdr({net:1});const P=Host;
 app.innerHTML=`<div class="wrap"><div class="pgrid"><div class="cfgcol" style="display:flex;flex-direction:column;gap:16px">

 <div style="display:flex;flex-direction:column;gap:16px"><div class="card guide" id="h-guide"></div><div class="card"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><span id="h-st" class="pill" style="background:var(--g3);color:var(--g);border-color:#b6d3c2"></span><span style="color:var(--mut);font-size:.9rem" id="h-sum"></span></div>

 if(P.status==='running'&&left<=10000&&left>0){const s=Math.ceil(left/1000);if(hostTick.s!==s){hostTick.s=s;Snd.tick()}}

  const on=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f};on('a-start',()=>{if(!Object.keys(P.teams).length&&!confirm('Aún no hay equipos conectados. ¿Iniciar de todos modos?'))return;P.start();Snd.go()});on('a-pause',()=>P.pause());on('a-res',()=>P.resume());on('a-p1',()=>P.addTime(60000));on('a-p5',()=>P.addTime(300000));on('a-fin',()=>{if(confirm('¿Finalizar el juego ahora?'))P.finish()});on('a-pod',showPodium);on('a-reset',()=>{if(confirm('Se borrarán los puntajes de todos los equipos. ¿Continuar?'))P.reset()})}
